<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Modulo: Kẹo & Nợ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 850px; width: 100%; text-align: center; }
        
        .input-section { background: #f8fafc; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        input[type="number"] { padding: 10px; font-size: 1.5em; width: 100px; text-align: center; border-radius: 8px; border: 2px solid #3b82f6; }

        .visual-area { display: flex; flex-direction: column; align-items: center; gap: 20px; margin: 30px 0; min-height: 200px; }
        .box-container { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .box { border: 2px dashed #cbd5e1; padding: 10px; border-radius: 8px; display: flex; gap: 5px; background: #fff; position: relative; }
        .box::after { content: "Hộp (2)"; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 0.7em; color: #94a3b8; }
        
        .item { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2em; }
        .candy { background: #10b981; color: white; box-shadow: 0 2px 4px rgba(16,185,129,0.3); }
        .debt { background: #ef4444; color: white; border-radius: 4px; box-shadow: 0 2px 4px rgba(239,68,68,0.3); }

        .leftover-area { border: 3px solid #3b82f6; padding: 15px; border-radius: 12px; background: #eff6ff; }
        .rule-badge { background: #f59e0b; color: white; padding: 5px 15px; border-radius: 5px; font-weight: bold; margin-bottom: 10px; display: none; }

        .code-block { background: #1e293b; color: #e2e8f0; padding: 15px; border-radius: 8px; text-align: left; font-family: monospace; margin-top: 20px; }
        .highlight { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minh họa Modulo: Kẹo & Nợ cho bài toán kiểm tra số chẵn, lẽ</h1>
        <h1>'%' operator</h1>
        <div class="input-section">
            <label style="font-weight: bold; font-size: 1.2em;">Số lượng (isInteger): </label>
            <input type="number" id="numInput" value="0">
            <p id="statusText" style="margin-top: 10px; font-weight: bold;"></p>
        </div>

        <div id="ruleBadge" class="rule-badge">⭐ TRÙM CUỐI: BÉ HƠN GIỮ NGUYÊN</div>

        <div class="visual-area">
            <div id="boxContainer" class="box-container"></div>
            <div style="font-size: 1.5em; font-weight: bold;">➡️ CÒN THỪA (PHẦN DƯ) ➡️</div>
            <div id="leftoverArea" class="leftover-area"></div>
        </div>

        <div class="code-block">
            <div><span style="color: #94a3b8;">// Kết quả C++ thực tế</span></div>
            <div>int result = <span id="codeExpr">0 % 2</span>; <span style="color: #94a3b8;">// result = </span> <span class="highlight" id="codeResult">0</span></div>
            <div style="margin-top: 10px;">bool isEven = (result == 0); <span style="color: #94a3b8;">// </span> <span id="evenResult" class="highlight">true</span></div>
        </div>
    </div>

    <script>
        const input = document.getElementById('numInput');
        const boxContainer = document.getElementById('boxContainer');
        const leftoverArea = document.getElementById('leftoverArea');
        const statusText = document.getElementById('statusText');
        const ruleBadge = document.getElementById('ruleBadge');
        const codeExpr = document.getElementById('codeExpr');
        const codeResult = document.getElementById('codeResult');
        const evenResult = document.getElementById('evenResult');

        function update() {
            let n = parseInt(input.value) || 0;
            let absN = Math.abs(n);
            let remainder = n % 2;
            let isNegative = n < 0;

            // 1. Cập nhật văn bản trạng thái
            if (n === 0) statusText.innerText = "Bạn không có kẹo, cũng không nợ kẹo.";
            else if (isNegative) statusText.innerText = `Bạn đang NỢ ${absN} viên kẹo.`;
            else statusText.innerText = `Bạn đang CÓ ${absN} viên kẹo.`;

            // 2. Quy tắc trùm cuối
            ruleBadge.style.display = (absN < 2 && n !== 0) ? "inline-block" : "none";

            // 3. Vẽ các hộp
            boxContainer.innerHTML = "";
            let fullBoxes = Math.floor(absN / 2);
            for (let i = 0; i < fullBoxes; i++) {
                const box = document.createElement('div');
                box.className = "box";
                box.innerHTML = `<div class="item ${isNegative ? 'debt' : 'candy'}">${isNegative ? '📄' : '🍬'}</div>
                                 <div class="item ${isNegative ? 'debt' : 'candy'}">${isNegative ? '📄' : '🍬'}</div>`;
                boxContainer.appendChild(box);
            }
            if (fullBoxes === 0 && absN >= 2) boxContainer.innerHTML = "Không đủ kẹo để đóng hộp.";
            if (n === 0) boxContainer.innerHTML = "(Trống rỗng)";

            // 4. Vẽ phần dư
            leftoverArea.innerHTML = "";
            let leftovers = absN % 2;
            if (leftovers === 0) {
                leftoverArea.innerText = "Không dư cái nào";
            } else {
                const item = document.createElement('div');
                item.className = `item ${isNegative ? 'debt' : 'candy'}`;
                item.innerText = isNegative ? '📄' : '🍬';
                leftoverArea.appendChild(item);
                if (isNegative) {
                    const label = document.createElement('span');
                    label.innerText = " (Vẫn nợ 1)";
                    label.style.color = "#ef4444";
                    leftoverArea.appendChild(label);
                }
            }

            // 5. Cập nhật code
            codeExpr.innerText = `${n} % 2`;
            codeResult.innerText = remainder;
            evenResult.innerText = (remainder === 0).toString();
        }

        input.addEventListener('input', update);
        update();
    </script>
</body>
</html>
